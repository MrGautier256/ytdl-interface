name: Build and release

# Deux façons de publier une release (tag vX.Y.Z + archives Windows et Linux) :
# - pousser un tag : git tag v1.2.0 && git push origin v1.2.0
# - onglet Actions > Build and release > Run workflow, en saisissant la version
#   (ex : 1.2.0) : le tag v1.2.0 est alors créé sur le commit compilé.
# Run workflow sans version = builds de test uniquement (artefacts, pas de release).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, ex : 1.2.0 (vide = builds de test, sans release)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  # Détermine la version (nom du tag poussé, ou champ saisi) et la valide avant de
  # lancer les builds, pour échouer tout de suite sur une faute de frappe.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(echo "$INPUT_VERSION" | tr -d '[:space:]')"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "Aucune version : builds de test, pas de release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide « $version » : format attendu X.Y.Z (ex : 1.2.0)."
            exit 1
          fi
          # Lancement manuel : ne jamais écraser une release existante
          if [ "$GITHUB_REF_TYPE" != "tag" ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then
            echo "::error::Le tag v$version existe déjà : choisis un autre numéro de version."
            exit 1
          fi
          echo "Version : $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            archive: YTDL-Interface-windows.zip
          # Le binaire Linux exige une glibc au moins aussi récente que celle de la
          # machine de build : on compile sur la plus ancienne Ubuntu disponible pour
          # rester compatible avec un maximum de distributions (glibc 2.35+).
          - os: ubuntu-22.04
            platform: linux
            archive: YTDL-Interface-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le numéro affiché dans l'app vient de ytdlgui/__init__.py : on y écrit la
      # version de la release, pour qu'il corresponde toujours au tag publié.
      - name: Set app version
        if: needs.prepare.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" ytdlgui/__init__.py
          grep "__version__ = \"$VERSION\"" ytdlgui/__init__.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bibliothèques Tcl/Tk partagées que PyInstaller embarque dans le build Linux
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtk8.6
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build
        run: pyinstaller --noconfirm --clean ytdl-interface.spec

      - name: Zip the release folder (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/YTDL-Interface -DestinationPath dist/${{ matrix.archive }}

      # tar.gz plutôt que zip : conserve le droit d'exécution du binaire
      - name: Tar the release folder (Linux)
        if: runner.os == 'Linux'
        run: tar -czf dist/${{ matrix.archive }} -C dist YTDL-Interface

      # Lance l'exécutable packagé quelques secondes sur un écran virtuel : un module
      # oublié par PyInstaller ferait planter le démarrage (error.log créé) au lieu de
      # laisser l'interface tourner jusqu'au timeout (code 124). Sur une copie, pour ne
      # pas mettre dans l'archive les fichiers que l'app crée au lancement (bin/...).
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          cp -r dist/YTDL-Interface "$RUNNER_TEMP/smoke"
          rc=0
          xvfb-run -a timeout 15 "$RUNNER_TEMP/smoke/YTDL-Interface" || rc=$?
          if [ -f "$RUNNER_TEMP/smoke/error.log" ]; then
            cat "$RUNNER_TEMP/smoke/error.log"
            exit 1
          fi
          if [ "$rc" -ne 124 ]; then
            echo "L'application s'est arrêtée prématurément (code $rc)."
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTDL-Interface-${{ matrix.platform }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  # Une seule release créée une fois les deux builds réussis (deux jobs qui
  # publieraient chacun de leur côté risqueraient de créer la release en double).
  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Si le tag n'existe pas encore (lancement manuel), il est créé ici sur le
      # commit compilé. Un tag créé avec le jeton du workflow ne relance pas ce
      # workflow : pas de double build.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/YTDL-Interface-windows.zip
            dist/YTDL-Interface-linux.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
